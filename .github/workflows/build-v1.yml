name: Assemble VeloRay 1.0

on:
  push:
    branches: [veloray-v1.0-staging, feat/subscription-workspace]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: '4'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify runtimes
        run: |
          if ! bash scripts/verify-runtime.sh; then
            bash scripts/build-runtime.sh
            bash scripts/verify-runtime.sh
          fi
          bash scripts/verify-runtime-toolchain.sh
      - run: python3 scripts/package-release.py --output "$RUNNER_TEMP/VeloRay-v1.0-GitHub.zip"
      - name: Verify complete container deployment
        run: VELORAY_DOCKER_TEST=1 bash scripts/test-docker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VeloRay-v1.0-GitHub
          path: ${{ runner.temp }}/VeloRay-v1.0-GitHub.zip
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION SHA256SUMS runtime/linux-amd64.tar.xz runtime/linux-arm64.tar.xz runtime/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "Bundle verified VeloRay 1.0 runtimes for both architectures"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
