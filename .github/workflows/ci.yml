name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: veloray_test
          POSTGRES_USER: veloray
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veloray -d veloray_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VELORAY_TEST_DATABASE_URL: postgres://veloray:test-password@127.0.0.1:5432/veloray_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: test "$(cat VERSION)" = 1.0
      - name: Test with pinned protocol runtimes
        run: |
          mkdir -p "$RUNNER_TEMP/veloray-cores"
          tar -xJf runtime/linux-amd64.tar.xz --no-same-owner -C "$RUNNER_TEMP/veloray-cores" xray/xray xray/geoip.dat xray/geosite.dat singbox/sing-box
          sudo setcap cap_net_admin+ep "$RUNNER_TEMP/veloray-cores/xray/xray"
          VELORAY_TEST_GEO_ASSETS="$RUNNER_TEMP/veloray-cores/xray" VELORAY_TEST_XRAY_BINARY="$RUNNER_TEMP/veloray-cores/xray/xray" VELORAY_TEST_SINGBOX_BINARY="$RUNNER_TEMP/veloray-cores/singbox/sing-box" go test -race ./... -count=1
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm ci && npm run format:check && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: |
          VELORAY_TEST_PORTAL_HTML="$RUNNER_TEMP/veloray-portal.html" VELORAY_TEST_MODERN_PORTAL_HTML="$RUNNER_TEMP/veloray-modern.html" VELORAY_TEST_SIMPLE_PORTAL_HTML="$RUNNER_TEMP/veloray-simple.html" go -C .. test ./internal/panel -run "TestCompactPortal|TestModernSubscriptionPortal|TestSimplePortalDefault" -count=1
          npx playwright install --with-deps chromium
          VELORAY_TEST_PORTAL_HTML="$RUNNER_TEMP/veloray-portal.html" VELORAY_TEST_MODERN_PORTAL_HTML="$RUNNER_TEMP/veloray-modern.html" VELORAY_TEST_SIMPLE_PORTAL_HTML="$RUNNER_TEMP/veloray-simple.html" npx playwright test --config playwright.refinements.config.ts
          npx playwright test --config playwright.pwa.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: panel-test-results
          path: frontend/test-results
      - run: for script in install.sh scripts/*.sh scripts/velorayctl deploy/node/install.sh; do bash -n "$script"; done
      - run: bash scripts/test-auto-update.sh
      - run: python3 scripts/test-deployment.py
      - run: |
          go build -buildvcs=false -o /tmp/veloray-cli ./cmd/veloray
          VELORAY_TEST_PANEL_BINARY=/tmp/veloray-cli bash scripts/test-installer.sh
      - run: go build -buildvcs=false ./cmd/veloray && go build -buildvcs=false ./cmd/veloray-agent
  containers:
    strategy:
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether runtime bundles match this source revision
        id: bundle
        run: |
          if bash scripts/verify-runtime.sh amd64; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo 'Main must include runtime bundles matching its source.' >&2
              exit 1
            fi
            echo 'Runtime assembly must finish before container verification.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify HTTPS, native traffic and durable restart in containers
        if: steps.bundle.outputs.ready == 'true'
        run: VELORAY_DOCKER_TEST=1 bash scripts/test-docker.sh
